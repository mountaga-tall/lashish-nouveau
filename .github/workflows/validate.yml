name: Validate site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nextjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build Next.js application
        run: npm run build

  legacy-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check legacy JavaScript syntax
        shell: bash
        run: |
          set -e
          node --check app.js
          node --check sw.js
          for file in data/*.js; do node --check "$file"; done
