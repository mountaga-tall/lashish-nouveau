name: Clean production repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: la-shish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });
            for (const branch of branches) {
              if (branch.name === "main") continue;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });
                core.info(`Deleted ${branch.name}`);
              } catch (error) {
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
              }
            }
      - name: Disable GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("DELETE /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                headers: { "X-GitHub-Api-Version": "2022-11-28" }
              });
              core.info("GitHub Pages disabled.");
            } catch (error) {
              const status = error.status ?? 0;
              if (status === 404) {
                core.info("GitHub Pages is already disabled.");
              } else {
                core.warning(`GitHub Pages could not be disabled: ${error.message}`);
              }
            }
